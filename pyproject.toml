[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dian-nit-validator"
version = "1.0.0"
description = "Librería y CLI en Python para cálculo y validación del Dígito de Verificación del NIT DIAN en Colombia (Módulo 11)."
readme = "README.md"
authors = [
    { name = "Kevin Andrey Herrera Silva", email = "kahs_kevin@hotmail.com" }
]
license = { text = "MIT" }
keywords = [
    "dian",
    "colombia",
    "nit",
    "validador-nit",
    "modulo-11",
    "digito-verificacion",
    "facturacion-electronica",
    "fintech"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial :: Accounting"
]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/KevinAndrey96/dian-nit-validator-python"
Repository = "https://github.com/KevinAndrey96/dian-nit-validator-python.git"

[project.scripts]
dian-nit = "nit_validator.cli:main"
nit-validator = "nit_validator.cli:main"
